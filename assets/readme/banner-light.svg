  <text x="452" y="200" class="font word">Klar<tspan class="acc">zeit</tspan></text>
  <text x="456" y="254" class="font tag">Deine Arbeitszeit. Dein Gerät. Sonst niemand.</text>

  <!-- Stoppuhr: läuft ab dem Öffnen der Seite -->
