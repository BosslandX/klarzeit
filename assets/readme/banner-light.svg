<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="titel beschreibung">
  <title id="titel">Klarzeit</title>
  <desc id="beschreibung">Klarzeit – Deine Arbeitszeit. Dein Gerät. Sonst niemand. Das Logo, eine Stoppuhr in Pixelart, deren Zeiger einen Haken bilden, und eine Stoppuhr, die beim Öffnen der Seite zu zählen beginnt.</desc>
  <style>
    /* Farben: eine Zeile je Rolle. Die dunkle Fassung tauscht nur diesen Block. */
    svg {
      --card-a: #eef4ff; --card-b: #ffffff; --card-line: #d9e2ef;
      --grid: #c3d1e6; --glow: #2563eb;
      --green: #16a34a; --accent: #2563eb; --text: #111827; --muted: #5b6472;
      --pill: #ffffff; --pill-line: #b7ebc9;
    }
    .font { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .bg-a { stop-color: var(--card-a); }
    .bg-b { stop-color: var(--card-b); }
    .glow-a { stop-color: var(--glow); stop-opacity: 0.16; }
    .glow-b { stop-color: var(--glow); stop-opacity: 0; }
    .card { stroke: var(--card-line); stroke-width: 1.5; }
    .gridline { fill: none; stroke: var(--grid); stroke-width: 1; }
    .dot { fill: var(--green); }
    .ripple { fill: var(--green); animation: ripple 2s ease-out infinite; }
    .word { font-size: 128px; font-weight: 800; letter-spacing: -3px; fill: var(--text); }
    .word .acc { fill: var(--accent); }
    .tag { font-size: 32px; font-weight: 500; fill: var(--muted); }
    .pill { fill: var(--pill); stroke: var(--pill-line); stroke-width: 1.5; }
    .digits { font-size: 28px; font-weight: 700; fill: var(--text); text-anchor: middle;
              font-variant-numeric: tabular-nums; }
    .live { font-size: 22px; font-weight: 600; fill: var(--green); }
    /* Stoppuhr: jede Ziffer ist ein Streifen 0–9 (bzw. 0–5), der stufenweise hochrutscht. */
    .s1 { animation: zehn 10s steps(10) infinite; }
    .s10 { animation: sechs 60s steps(6) infinite; }
    .m1 { animation: zehn 600s steps(10) infinite; }
    .m10 { animation: sechs 3600s steps(6) infinite; }
    .h1 { animation: zehn 36000s steps(10) infinite; }
    @keyframes ripple { from { transform: scale(1); opacity: 0.55; } to { transform: scale(2.6); opacity: 0; } }
    @keyframes zehn { to { transform: translateY(-360px); } }
    @keyframes sechs { to { transform: translateY(-216px); } }
    @media (prefers-reduced-motion: reduce) {
      .ripple, .s1, .s10, .m1, .m10, .h1 { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="bg-a"/>
      <stop offset="1" class="bg-b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" class="glow-a"/>
      <stop offset="1" class="glow-b"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" class="gridline"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask">
      <rect width="1280" height="400" fill="url(#fade)"/>
    </mask>
    <clipPath id="cardclip">
      <rect width="1280" height="400" rx="28"/>
    </clipPath>
  </defs>

  <!-- Karte mit Raster (Stundenzettel) und Lichthof hinter der Uhr -->
  <rect x="0.75" y="0.75" width="1278.5" height="398.5" rx="28" fill="url(#bg)" class="card"/>
  <g clip-path="url(#cardclip)">
    <rect width="1280" height="400" fill="url(#grid)" mask="url(#gridmask)"/>
    <circle cx="250" cy="200" r="260" fill="url(#glow)"/>
  </g>

